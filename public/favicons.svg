<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Book shape -->
  <rect x="15" y="10" width="70" height="80" rx="4" fill="url(#bookGrad)" />
  <!-- Pages -->
  <rect x="22" y="15" width="56" height="70" rx="2" fill="#fafafa" />
  <!-- Page lines -->
  <line x1="28" y1="28" x2="72" y2="28" stroke="#e5e7eb" stroke-width="2" />
  <line x1="28" y1="38" x2="72" y2="38" stroke="#e5e7eb" stroke-width="2" />
  <line x1="28" y1="48" x2="62" y2="48" stroke="#e5e7eb" stroke-width="2" />
  <line x1="28" y1="58" x2="72" y2="58" stroke="#e5e7eb" stroke-width="2" />
  <line x1="28" y1="68" x2="55" y2="68" stroke="#e5e7eb" stroke-width="2" />
  <!-- Bookmark -->
  <polygon points="65,10 75,10 75,35 70,28 65,35" fill="#ef4444" />
</svg>
